# New-Birth — nginx config: SPA fallback, gzip, immutable asset caching
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip for text assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # Hashed Vite assets: cache immutably
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Images & audio: cache, but revalidate occasionally
    location ~* \.(webp|avif|png|jpg|jpeg|gif|mp3|ogg|wav)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Everything else: SPA fallback (index.html never cached)
    location / {
        expires -1;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
